<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Mass Index (BMI) Calculator</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .bmi-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .unit-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .unit-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .unit-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button.calc-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        button.calc-btn:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            background: var(--bg);
            text-align: center;
            display: none;
        }

        .bmi-score {
            font-size: 2rem;
            font-weight: 700;
            margin: 5px 0;
        }

        .bmi-category {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="bmi-card">
    <h2>BMI Calculator</h2>
    
    <div class="unit-toggle">
        <button type="button" class="unit-btn active" id="metric-btn" onclick="setUnit('metric')">Metric</button>
        <button type="button" class="unit-btn" id="imperial-btn" onclick="setUnit('imperial')">Imperial</button>
    </div>

    <form id="bmiForm" onsubmit="calculateBMI(event)">
        <!-- Metric Inputs -->
        <div id="metric-inputs">
            <div class="input-group">
                <label for="weight-metric">Weight (kg)</label>
                <input type="number" id="weight-metric" step="0.1" min="1">
            </div>
            <div class="input-group">
                <label for="height-metric">Height (cm)</label>
                <input type="number" id="height-metric" step="0.1" min="1">
            </div>
        </div>

        <!-- Imperial Inputs -->
        <div id="imperial-inputs" class="hidden">
            <div class="input-group">
                <label for="weight-imperial">Weight (lbs)</label>
                <input type="number" id="weight-imperial" step="0.1" min="1">
            </div>
            <div class="input-group">
                <label>Height</label>
                <div class="input-row">
                    <input type="number" id="height-ft" placeholder="ft" min="0">
                    <input type="number" id="height-in" placeholder="in" min="0" max="11">
                </div>
            </div>
        </div>

        <button type="submit" class="calc-btn">Calculate BMI</button>
    </form>

    <div class="result-box" id="result">
        <div>Your BMI is</div>
        <div class="bmi-score" id="bmi-value">--</div>
        <div class="bmi-category" id="bmi-status">--</div>
    </div>
</div>

<script>
    let currentUnit = 'metric';

    function setUnit(unit) {
        currentUnit = unit;
        document.getElementById('metric-btn').classList.toggle('active', unit === 'metric');
        document.getElementById('imperial-btn').classList.toggle('active', unit === 'imperial');
        document.getElementById('metric-inputs').classList.toggle('hidden', unit !== 'metric');
        document.getElementById('imperial-inputs').classList.toggle('hidden', unit !== 'imperial');
        
        // Reset required attributes based on visible fields
        if (unit === 'metric') {
            document.getElementById('weight-metric').required = true;
            document.getElementById('height-metric').required = true;
            document.getElementById('weight-imperial').required = false;
            document.getElementById('height-ft').required = false;
            document.getElementById('height-in').required = false;
        } else {
            document.getElementById('weight-metric').required = false;
            document.getElementById('height-metric').required = false;
            document.getElementById('weight-imperial').required = true;
            document.getElementById('height-ft').required = true;
            document.getElementById('height-in').required = true;
        }
    }

    // Initialize required fields on load
    setUnit('metric');

    function calculateBMI(event) {
        event.preventDefault();
        let bmi = 0;

        if (currentUnit === 'metric') {
            const weight = parseFloat(document.getElementById('weight-metric').value);
            const heightCm = parseFloat(document.getElementById('height-metric').value);
            const heightM = heightCm / 100;
            
            if (weight > 0 && heightM > 0) {
                bmi = weight / (heightM * heightM);
            }
        } else {
            const weight = parseFloat(document.getElementById('weight-imperial').value);
            const feet = parseFloat(document.getElementById('height-ft').value) || 0;
            const inches = parseFloat(document.getElementById('height-in').value) || 0;
            const totalInches = (feet * 12) + inches;

            if (weight > 0 && totalInches > 0) {
                bmi = (weight / (totalInches * totalInches)) * 703;
            }
        }

        displayResult(bmi);
    }

    function displayResult(bmi) {
        const resultBox = document.getElementById('result');
        const valueText = document.getElementById('bmi-value');
        const statusText = document.getElementById('bmi-status');

        if (bmi <= 0 || isNaN(bmi)) {
            resultBox.style.display = 'none';
            return;
        }

        const roundedBmi = bmi.toFixed(1);
        valueText.innerText = roundedBmi;

        let category = "";
        let color = "#1e293b";

        if (bmi < 18.5) {
            category = "Underweight";
            color = "#3b82f6"; // Blue
        } else if (bmi >= 18.5 && bmi < 25) {
            category = "Normal Weight";
            color = "#10b981"; // Green
        } else if (bmi >= 25 && bmi < 30) {
            category = "Overweight";
            color = "#f59e0b"; // Orange
        } else {
            category = "Obesity";
            color = "#ef4444"; // Red
        }

        statusText.innerText = category;
        statusText.style.color = color;
        resultBox.style.display = 'block';
    }
</script>

</body>
</html>
